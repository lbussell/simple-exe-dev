[project]
name = "simple-exe-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Logan Bussell", email = "github@loganbussell.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
]

[project.scripts]
simple-exe-dev = "simple_exe_dev:main"

[tool.uv.build-backend]
module-name = ["simple_exe_dev", "exedev"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
]
