{% extends 'simple_exe_dev/base.html' %}

{% block content %}
  <h1>{{ info.emoji }} {{ info.name }}</h1>
  <dl>
    <dt>Owner</dt>
    <dd>{{ email }}</dd>
    <dt>Tags</dt>
    <dd>{{ tags|join:", "|default:"None" }}</dd>
    <dt>Comment</dt>
    <dd>{{ comment|default:"None" }}</dd>
    <dt>Default port</dt>
    <dd>{{ default_port }}</dd>
  </dl>
{% endblock %}
