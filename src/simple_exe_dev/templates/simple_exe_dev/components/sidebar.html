<nav class="sidebar" :class="{ open: sidebarOpen }">
  <a href="{% url 'index' %}" class="sidebar-header">{{ vm.emoji }} <span class="name">{{ vm.name }}</span></a>
  {% for page in pages %}
    <a href="{% url page.url_name %}" class="sidebar-link"
       {% if page.url_name == current_page %}aria-current="page"{% endif %}>
      <span class="{{ page.icon }}"></span> {{ page.title }}
    </a>
  {% endfor %}
  {% if request.user %}
    <a href="{% url 'settings' %}" class="sidebar-user" title="{{ request.user.email }}">
      <span class="icon-[lucide--circle-user]"></span> {{ request.user.name }}
    </a>
  {% endif %}
</nav>
